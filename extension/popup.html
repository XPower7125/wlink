<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 340px;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 16px;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      h1 {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
      }
      h1 span {
        background: linear-gradient(90deg, #38bdf8, #2563eb);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #url {
        width: 100%;
        border: 1px solid #1e293b;
        background: #020617;
        color: #94a3b8;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        margin-bottom: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #shorten {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 10px;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(90deg, #0ea5e9, #2563eb);
        cursor: pointer;
        transition: filter 0.15s;
      }
      #shorten:hover { filter: brightness(1.1); }
      #shorten:disabled { opacity: 0.5; cursor: not-allowed; }
      #result { display: none; margin-top: 12px; }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 10px;
        padding: 8px 10px;
      }
      #short-url {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: #38bdf8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .btn {
        border: 1px solid #1e293b;
        background: #1e293b;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover { background: #334155; }
      #msg { margin-top: 8px; font-size: 12px; line-height: 1.4; }
      #msg.error { color: #fb7185; }
      #msg.ok { color: #4ade80; }
      footer { margin-top: 12px; font-size: 11px; text-align: center; }
      footer a { color: #64748b; text-decoration: none; }
      footer a:hover { color: #38bdf8; }
    </style>
  </head>
  <body>
    <header>
      <h1>w<span>link</span></h1>
    </header>
    <div id="url">Loading tab…</div>
    <button id="shorten">Shorten this page ✨</button>
    <div id="result">
      <div class="row">
        <span id="short-url" title="Click to open"></span>
        <button class="btn" id="copy">Copy</button>
        <button class="btn" id="qr">QR</button>
      </div>
    </div>
    <div id="msg"></div>
    <footer>
      <a href="#" id="options-link">Settings</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
