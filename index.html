<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- V7 fix: baseline CSP. connect-src must allow the Convex deployment
         (WSS + HTTPS) since the API lives on a separate origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-D21axFi89WvCEPuOBEAWPc4EaOa7WiGEqZUPuHjgZ5s='; connect-src 'self' wss://*.convex.cloud https://*.convex.cloud https://*.convex.site wss://*.convex.site; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'"
    />
    <link rel="icon" type="image/png" href="/wlink.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        if (localStorage.getItem('wlink:theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch (e) {}
    </script>
    <title>wlink — The best URL shortener</title>
    <!-- wlink's own embed: shown when the site itself is shared on Discord etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="wlink" />
    <meta property="og:title" content="wlink — The best URL shortener" />
    <meta property="og:description" content="Shorten links, pin and bump them, add custom embeds, QR codes and more. Free, fast and Discord-friendly." />
    <meta property="og:image" content="/wlink.png" />
    <meta property="og:url" content="/" />
    <meta name="theme-color" content="#38bdf8" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="wlink — The best URL shortener" />
    <meta name="twitter:description" content="Shorten links, pin and bump them, add custom embeds, QR codes and more. Free, fast and Discord-friendly." />
    <meta name="twitter:image" content="/wlink.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
